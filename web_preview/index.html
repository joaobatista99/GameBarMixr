<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameBarMixr - Minimalist Xbox Game Bar Widget</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Xbox Game Bar Overlay Simulator -->
  <div class="gamebar-overlay-bg">
    
    <!-- Minimal GameBarMixr Widget Container -->
    <div class="widget-window">
      
      <!-- Top Bar: Segmented Switcher & Refresh -->
      <div class="widget-topbar">
        <div class="segmented-pill">
          <button class="pill-btn active" data-tab="audio">Áudio</button>
          <button class="pill-btn" data-tab="bluetooth">Bluetooth <span class="dot-indicator" id="btDot"></span></button>
        </div>
        
        <div class="topbar-right">
          <button class="icon-btn" id="pinBtn" title="Fixar na tela">📌</button>
          <button class="icon-btn" id="refreshBtn" title="Atualizar">🔄</button>
        </div>
      </div>

      <!-- Main Widget Body -->
      <div class="widget-body">
        
        <!-- PANE 1: AUDIO MIXER -->
        <div class="tab-pane active" id="tab-audio">
          <div class="section-tag">SAÍDA</div>
          <div class="audio-list" id="audioDevicesList">
            <!-- Rendered by JS -->
          </div>

          <div class="section-tag" style="margin-top: 14px;">APLICATIVOS</div>
          <div class="app-list" id="appMixerList">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- PANE 2: BLUETOOTH MANAGER -->
        <div class="tab-pane" id="tab-bluetooth">
          <div class="section-tag">DISPOSITIVOS EMPARELHADOS</div>
          <div class="bt-list" id="btDevicesList">
            <!-- Rendered by JS -->
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
